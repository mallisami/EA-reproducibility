# Template: RUNID is substituted by deploy/render.sh (never apply this file directly).
# e38v2-system : long-lived control namespace (webhook + the four identities); never audited, never webhooked.
# e38v2-RUNID  : per-run test namespace; the ONLY namespace the webhook and the RequestResponse audit rules act on.
apiVersion: v1
kind: Namespace
metadata:
  name: e38v2-system
  labels:
    e38-managed: "true"
    e38v2-role: system
---
apiVersion: v1
kind: Namespace
metadata:
  name: e38v2-RUNID
  labels:
    e38-managed: "true"
    e38-run-id: RUNID
    e38v2-role: test
