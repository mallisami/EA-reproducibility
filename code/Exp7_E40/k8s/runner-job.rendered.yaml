# E40 runner: a Kubernetes Job in e40-system. The container idles; probes, smoke and the full run are started inside it
# with `kubectl exec` (nohup) so outputs stay in /out (emptyDir) until copied with `kubectl cp`.
# Code: ConfigMaps built from the E39 LOCKED tree (prefix-renamed copy) + E40 wrappers; copied by the init container.
# Identities: TokenRequest tokens of e40-{responder,writer,reset,mirror} in Secret e40-tokens (mounted at /tokens).
# The Pod's own ServiceAccount e40-runner has NO RBAC; its projected ca.crt is the pinned cluster CA.
apiVersion: v1
kind: ServiceAccount
metadata: {name: e40-runner, namespace: e40-system, labels: {e40-managed: "true"}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e40-runner
  namespace: e40-system
  labels: {app: e40-runner, e40-managed: "true"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: e40-runner, e40-managed: "true"}
    spec:
      serviceAccountName: e40-runner
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: stage-code
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /e40/src/flashir_core /e40/frozen_ref/source_provenance /e40/e40 /e40/pylib
          cp /cm/src/*.py /e40/src/
          cp /cm/core/*.py /e40/src/flashir_core/
          cp /cm/f5/E37_F5_PHYS_ORIGINAL.json /e40/frozen_ref/source_provenance/
          cp /cm/e40/*.py /e40/e40/
          tar xzf /cm/pylib/pylib.tgz -C /e40/pylib
          cd /e40 && find src frozen_ref e40 -type f | sort | xargs sha256sum > /e40/INCLUSTER_SHA256.txt
          sha256sum /cm/pylib/pylib.tgz >> /e40/INCLUSTER_SHA256.txt
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        volumeMounts:
        - {name: work, mountPath: /e40}
        - {name: cm-src, mountPath: /cm/src}
        - {name: cm-core, mountPath: /cm/core}
        - {name: cm-f5, mountPath: /cm/f5}
        - {name: cm-e40, mountPath: /cm/e40}
        - {name: cm-pylib, mountPath: /cm/pylib}
      containers:
      - name: runner
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "echo e40-runner idle; sleep 14000"]
        env:
        - {name: E40_ROOT, value: /e40}
        - {name: PYTHONPATH, value: /e40/pylib}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: E40_TOKEN_DIR, value: /tokens}
        - {name: E40_E39_SEED, value: "972231175"}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        resources:
          requests: {cpu: 500m, memory: 256Mi}
          limits: {memory: 1Gi}      # no CPU limit (CFS throttling would distort timing)
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        volumeMounts:
        - {name: work, mountPath: /e40}
        - {name: out, mountPath: /out}
        - {name: tokens, mountPath: /tokens, readOnly: true}
      volumes:
      - {name: work, emptyDir: {}}
      - {name: out, emptyDir: {}}
      - name: tokens
        secret: {secretName: e40-tokens, defaultMode: 0440}
      - name: cm-src
        configMap: {name: e40-code-src}
      - name: cm-core
        configMap: {name: e40-code-core}
      - name: cm-f5
        configMap: {name: e40-code-f5}
      - name: cm-e40
        configMap: {name: e40-code-e40}
      - name: cm-pylib
        configMap: {name: e40-pylib}
---
# Pre-pull: makes AKS pull python:3.12-slim (Docker Hub) and registry.k8s.io/pause:3.10 onto the node, so the E39
# manifests/code (imagePullPolicy Never) find both images present.
apiVersion: v1
kind: Pod
metadata:
  name: e40-prepull
  namespace: e40-system
  labels: {e40-managed: "true"}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  containers:
  - {name: pause, image: "registry.k8s.io/pause:3.10", imagePullPolicy: IfNotPresent}
  - {name: py, image: "python:3.12-slim", imagePullPolicy: IfNotPresent, command: ["python", "-c", "print('ok')"]}
