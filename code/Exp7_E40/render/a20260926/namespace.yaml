# Template: a20260926 is substituted by deploy/render.sh (never apply this file directly).
# e40-system : long-lived control namespace (webhook + the six identities); never audited, never webhooked.
# e40-a20260926  : per-run test namespace; the ONLY namespace the webhook and the RequestResponse audit rules act on.
# e40-load   : E39-D background-load namespace (load identity only); audit level None, never webhooked.
#              Created here so that the load Role in rbac.yaml can be applied; re-applying for a second
#              RUN_ID is idempotent.
apiVersion: v1
kind: Namespace
metadata:
  name: e40-system
  labels:
    e40-managed: "true"
    e40-role: system
---
apiVersion: v1
kind: Namespace
metadata:
  name: e40-a20260926
  labels:
    e40-managed: "true"
    e40-run-id: a20260926
    e40-role: test
---
apiVersion: v1
kind: Namespace
metadata:
  name: e40-load
  labels:
    e40-managed: "true"
    e40-role: load
