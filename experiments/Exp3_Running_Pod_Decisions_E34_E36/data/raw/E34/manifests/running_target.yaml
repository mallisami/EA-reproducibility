apiVersion: v1
kind: Namespace
metadata:
  name: flashir-e34
---
apiVersion: v1
kind: Pod
metadata:
  name: flashir-running-target
  namespace: flashir-e34
  labels:
    app: flashir-running-target
    incident: "true"
    response-allowed: "true"
    irrelevant: "base"
spec:
  containers:
    - name: web
      image: nginx:1.27.5-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 15
  restartPolicy: Never
