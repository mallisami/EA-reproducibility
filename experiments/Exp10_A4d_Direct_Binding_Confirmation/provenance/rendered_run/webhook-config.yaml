# Template: a4dcr-r2-20261001 substituted by deploy/render.sh; the caBundle placeholder below by deploy/gen_certs.sh.
# Installed once for the whole run (arms are randomised within blocks, so the webhook
# cannot be toggled per trial). Per-trial arm selection is done by objectSelector:
# the webhook is called ONLY for objects labelled e39-webhook=enforce, which the runner
# sets for A3 trials only. A1/A2/A4 targets carry no such label -> no call, no latency.
# objectSelector mechanism (API server semantics):
#   - Pod DELETE: the selector is evaluated against oldObject (the Pod being deleted), so the
#     TARGET POD must carry e39-webhook=enforce.
#   - NetworkPolicy CREATE (E39-E): there is no oldObject; the selector is evaluated against the NEW
#     object, so the NETWORKPOLICY being created must carry e39-webhook=enforce (the label on the
#     isolated Pod is irrelevant for this rule). Unlabelled NetworkPolicies are never sent.
# Scope:
#   - operations DELETE on core/v1 pods and CREATE on networking.k8s.io/v1 networkpolicies, namespaced
#   - namespaceSelector: exactly the test namespace (kubernetes.io/metadata.name is set by the API server)
#   - objectSelector: e39-webhook=enforce
#   - matchConditions (CEL, GA since v1.30): the webhook is NOT called for the reset identity,
#     kubelets (final grace-0 DELETE of an already-terminating Pod) and the namespace/GC controllers,
#     so fixture reset and namespace teardown can never be blocked by failurePolicy Fail.
#     (The server additionally exempts the same users; WEBHOOK_EXEMPT_USERS in webhook.yaml.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: e39-action-revalidation
  labels: {e39-managed: "true", e39-run-id: a4dcr-r2-20261001}
webhooks:
- name: action-revalidation.e39.e39-managed.local
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Exact
  timeoutSeconds: 5
  clientConfig:
    service:
      namespace: e39-system
      name: e39-webhook
      path: /validate
      port: 443
    caBundle: 
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["DELETE"]
    resources: ["pods"]
    scope: Namespaced
  - apiGroups: ["networking.k8s.io"]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["networkpolicies"]
    scope: Namespaced
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: e39-a4dcr-r2-20261001
  objectSelector:
    matchLabels:
      e39-webhook: enforce
  matchConditions:
  - name: exempt-reset-identity
    expression: "request.userInfo.username != 'system:serviceaccount:e39-system:e39-reset'"
  - name: exempt-kubelets
    expression: "!request.userInfo.username.startsWith('system:node:')"
  - name: exempt-namespace-and-gc-controllers
    expression: "!(request.userInfo.username in ['system:serviceaccount:kube-system:namespace-controller', 'system:serviceaccount:kube-system:generic-garbage-collector'])"
